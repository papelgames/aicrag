{% extends "base_template.html" %}

{% block title %}
    aicrag | Esperar pago
{% endblock %}

{% block content %}
<meta http-equiv="refresh" content="2">
<div class="container-fluid mt-3 px-4">

    <!-- Header -->
    <div class="row align-items-center mb-4">
        <div class="col-md-6">
            <h3 class="fw-bold mb-0">
                <i class="bi bi-credit-card me-2 text-primary"></i>
                Procesando pago
            </h3>
        </div>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-5 text-center">

                    <div class="spinner-border text-primary mb-4" style="width: 4rem; height: 4rem;" role="status">
                        <span class="visually-hidden">Cargando...</span>
                    </div>

                    <h5 class="fw-semibold mb-2">Esperando confirmación del pago...</h5>
                    <p class="text-muted small mb-4">No cierre esta ventana.</p>

                    <a href="{{ url_for('gestiones.cancelar_pago', order_id=order_id, id_venta=id_venta) }}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg me-1"></i> Cancelar pago
                    </a>

                </div>
            </div>
        </div>
    </div>

</div>
{% endblock %}
